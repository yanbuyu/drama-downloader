name: Python regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q drama_downloader.py drama_direct.py drama_sign.py drama_v5.py drama_v5_tables.py tests
      - name: Protocol golden vectors
        run: python drama_downloader.py selftest
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
